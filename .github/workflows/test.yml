name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: linecache tests (FANOUT=4)
        run: just lc
      - name: linecache tests (FANOUT=8)
        run: just lc8
      - name: piecetab tests
        run: just pt
      - name: undotree tests
        run: just ut
      - name: cellgrid tests
        run: just cg
      - name: termfeed tests
        run: just tf
      - name: spantree tests (FANOUT=4)
        run: just sp
      - name: spantree tests (FANOUT=8)
        run: just sp8

  lua-tmux:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - name: Cache Homebrew
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Cache LuaRocks dependencies
        uses: actions/cache@v4
        id: luarocks-cache
        with:
          path: .luarocks
          key: ${{ runner.os }}-luarocks-${{ hashFiles('.github/luarocks-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-luarocks-
      - name: Configure Fast APT Mirror
        if: runner.os == 'Linux'
        uses: vegardit/fast-apt-mirror.sh@v1
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - name: install system deps
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libuv; else sudo apt-get install -y libuv1-dev; fi
      - name: Install LuaRocks dependencies
        if: steps.luarocks-cache.outputs.cache-hit != 'true'
        run: |
          luarocks install luautf8
          luarocks install luv
      - name: tmux display tests
        run: just lua/ed-tmux
      - name: lua binding tests
        run: |
          cd lua
          for t in piecetab cellgrid spantree termfeed json lsp; do
            echo "=== $t ==="
            lua tests/${t}_test.lua || exit 1
          done
      - name: editor tests with tree-sitter (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tree-sitter
          cd lua
          sh ../misc/fetch_grammars.sh c lua
          LUA_INC=$(just --evaluate LUA_INC)
          gcc -Wall -Wextra -Wconversion -Wno-sign-conversion -Werror -std=gnu99 -Wno-variadic-macros -Wno-array-bounds -I. -I.. $LUA_INC -I/opt/homebrew/include -DNDEBUG -O2 -bundle -undefined dynamic_lookup -o treesitter.so treesitter.c -L/opt/homebrew/lib -ltree-sitter
          lua tests/editor_test.lua

  test-windows:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: step-security/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: windows tests
        shell: cmd
        run: misc\run_tests_windows.bat

  coverage:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      # setup-lcov builds lcov v2.5 from source (Perl deps + Sphinx docs);
      # cache a local install under ~/.lcov to avoid rebuilding every run.
      - name: Restore LCOV cache
        id: lcov-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.lcov
          key: ${{ runner.os }}-lcov-v2.5-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-lcov-v2.5-
      - name: Configure Fast APT Mirror
        if: runner.os == 'Linux' && steps.lcov-cache.outputs.cache-hit != 'true'
        uses: vegardit/fast-apt-mirror.sh@v1
      - name: Install LCOV (cache miss)
        if: steps.lcov-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cpanminus python3-sphinx python3-sphinx-rtd-theme libcrypt-dev
          cpanm --local-lib-contained "$HOME/.lcov/perl5" --notest Capture::Tiny DateTime
          rm -rf /tmp/lcov
          git clone --depth 1 --branch v2.5 https://github.com/linux-test-project/lcov.git /tmp/lcov
          make -C /tmp/lcov install PREFIX="$HOME/.lcov/lcov"
      - name: Save LCOV cache
        if: steps.lcov-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.lcov
          key: ${{ runner.os }}-lcov-v2.5-${{ hashFiles('.github/workflows/test.yml') }}
      - name: Add LCOV to environment
        run: |
          echo "$HOME/.lcov/lcov/bin" >> "$GITHUB_PATH"
          LCOV_PERL5LIB="$HOME/.lcov/perl5/lib/perl5"
          ARCH_DIR="$HOME/.lcov/perl5/lib/perl5/$(perl -MConfig -e 'print $Config{archname}')"
          if [ -d "$ARCH_DIR" ]; then
            LCOV_PERL5LIB="$LCOV_PERL5LIB:$ARCH_DIR"
          fi
          if [ -n "${PERL5LIB:-}" ]; then
            echo "PERL5LIB=$LCOV_PERL5LIB:$PERL5LIB" >> "$GITHUB_ENV"
          else
            echo "PERL5LIB=$LCOV_PERL5LIB" >> "$GITHUB_ENV"
          fi
      - name: coverage
        run: just cov
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
