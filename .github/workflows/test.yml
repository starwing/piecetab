name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          lua-version: "5.4"
      - name: linecache tests (FANOUT=4)
        run: just lc
      - name: linecache tests (FANOUT=8)
        run: just lc8
      - name: piecetab tests
        run: just pt
      - name: undotree tests
        run: just ut
      - name: cellgrid tests
        run: just cg
      - name: termfeed tests
        run: just tf

  coverage:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          lua-version: "5.4"
      - name: install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: coverage
        run: just cov
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
