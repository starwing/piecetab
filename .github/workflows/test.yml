name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: linecache tests (FANOUT=4)
        run: just lc
      - name: linecache tests (FANOUT=8)
        run: just lc8
      - name: piecetab tests
        run: just pt
      - name: undotree tests
        run: just ut
      - name: cellgrid tests
        run: just cg
      - name: termfeed tests
        run: just tf
      - name: spantree tests (FANOUT=4)
        run: just sp
      - name: spantree tests (FANOUT=8)
        run: just sp8
      - name: spantree lua tests
        run: just lua/build-lua spantree && cd lua && lua tests/spantree_test.lua

  lua-tmux:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - name: Prepare apt cache directories
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /var/cache/apt/archives /var/lib/apt/lists
          sudo chmod -R a+rwX /var/cache/apt/archives /var/lib/apt/lists
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      - name: Cache Homebrew
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-
      - name: Prepare LuaRocks cache directories
        run: mkdir -p ~/.luarocks ~/.cache/luarocks
      - name: Cache LuaRocks
        uses: actions/cache@v4
        with:
          path: |
            ~/.luarocks
            ~/.cache/luarocks
          key: ${{ runner.os }}-luarocks-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-luarocks-
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - uses: leafo/gh-actions-luarocks@v6
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - name: install rocks
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libuv; else sudo apt-get install -y libuv1-dev; fi
          luarocks install luautf8 && luarocks install luv
      - name: tmux display tests
        run: just lua/ed-tmux

  test-windows:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: step-security/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: windows tests
        shell: cmd
        run: misc\run_tests_windows.bat

  coverage:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: coverage
        run: just cov
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
