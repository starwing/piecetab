name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: linecache tests (FANOUT=4)
        run: just lc
      - name: linecache tests (FANOUT=8)
        run: just lc8
      - name: piecetab tests
        run: just pt
      - name: undotree tests
        run: just ut
      - name: cellgrid tests
        run: just cg
      - name: termfeed tests
        run: just tf
      - name: spantree tests (FANOUT=4)
        run: just sp
      - name: spantree tests (FANOUT=8)
        run: just sp8

  lua-tmux:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - name: Cache Homebrew
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Cache LuaRocks dependencies
        uses: actions/cache@v4
        id: luarocks-cache
        with:
          path: .luarocks
          key: ${{ runner.os }}-luarocks-${{ hashFiles('.github/luarocks-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-luarocks-
      - name: Configure Fast APT Mirror
        if: runner.os == 'Linux'
        uses: vegardit/fast-apt-mirror.sh@v1
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - name: install system deps
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libuv; else sudo apt-get install -y libuv1-dev; fi
      - name: Install LuaRocks dependencies
        if: steps.luarocks-cache.outputs.cache-hit != 'true'
        run: |
          luarocks install luautf8
          luarocks install luv
      - name: tmux display tests
        run: just lua/ed-tmux
      - name: lua binding tests
        run: |
          cd lua
          for t in piecetab cellgrid spantree termfeed json lsp; do
            echo "=== $t ==="
            lua tests/${t}_test.lua || exit 1
          done
      - name: editor tests with tree-sitter (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tree-sitter
          cd lua
          sh ../misc/fetch_grammars.sh c lua
          LUA_INC=$(just --evaluate LUA_INC)
          gcc -Wall -Wextra -Wconversion -Wno-sign-conversion -Werror -std=gnu99 -Wno-variadic-macros -Wno-array-bounds -I. -I.. $LUA_INC -I/opt/homebrew/include -DNDEBUG -O2 -bundle -undefined dynamic_lookup -o treesitter.so treesitter.c -L/opt/homebrew/lib -ltree-sitter
          lua tests/editor_test.lua

  test-windows:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - uses: step-security/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: windows tests
        shell: cmd
        run: misc\run_tests_windows.bat

  coverage:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: extractions/setup-just@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"
      - name: Configure Fast APT Mirror
        if: runner.os == 'Linux'
        uses: vegardit/fast-apt-mirror.sh@v1
      - name: Install Sphinx for LCOV
        run: sudo apt-get update && sudo apt-get install -y python3-sphinx python3-sphinx-rtd-theme
      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1
        with:
          ref: v2.5
      - name: coverage
        run: just cov
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info
